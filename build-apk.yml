name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile-app/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Copy custom app icon
        run: |
          cp icon-resources/mipmap-mdpi/*.png android/app/src/main/res/mipmap-mdpi/
          cp icon-resources/mipmap-hdpi/*.png android/app/src/main/res/mipmap-hdpi/
          cp icon-resources/mipmap-xhdpi/*.png android/app/src/main/res/mipmap-xhdpi/
          cp icon-resources/mipmap-xxhdpi/*.png android/app/src/main/res/mipmap-xxhdpi/
          cp icon-resources/mipmap-xxxhdpi/*.png android/app/src/main/res/mipmap-xxxhdpi/

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myshop-app
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
